<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#070b1f">
  <title>Happy Bird Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23070b1f'/%3E%3Crect x='3' y='5' width='9' height='7' fill='%23f8b72b'/%3E%3Crect x='9' y='6' width='3' height='3' fill='%23fff'/%3E%3Crect x='11' y='9' width='4' height='2' fill='%23e8562a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
  <div class="admin-bg" aria-hidden="true"><div class="grid"></div></div>

  <!-- ============ SIGN-IN ============ -->
  <main class="login" id="login" hidden>
    <form class="login__card glass" id="loginForm" autocomplete="off" novalidate>
      <div class="login__bird" aria-hidden="true"></div>
      <p class="px login__eyebrow">RESTRICTED AREA</p>
      <h1>Happy Bird <em>Console</em></h1>
      <p class="login__sub">Sign in to manage releases and platforms.</p>
      <label class="field">
        <span>Administrator password</span>
        <input id="pw" type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="msg msg--err" id="loginMsg" role="alert" hidden></p>
      <button class="btn btn--sun" id="loginBtn" type="submit">SIGN IN</button>
    </form>
  </main>

  <!-- ============ DASHBOARD ============ -->
  <div class="dash" id="dash" hidden>
    <aside class="side glass">
      <div class="side__brand"><span class="nav__logo" aria-hidden="true"></span><strong>HAPPY<b>BIRD</b></strong><small class="px">CONSOLE</small></div>
      <nav class="side__nav" aria-label="Console">
        <a href="/new/releases" data-mode="releases">📦 Releases</a>
        <a href="/new/base" data-mode="base">🖥 Platforms</a>
      </nav>
      <div class="side__foot">
        <p class="side__sess" id="sess"></p>
        <button class="btn btn--ghost btn--sm" id="logout">LOG OUT</button>
      </div>
    </aside>
    <main class="main">
      <header class="main__head">
        <div><p class="px eyebrow-px" id="viewKicker"></p><h1 id="viewTitle"></h1></div>
        <div class="main__actions" id="viewActions"></div>
      </header>
      <div id="view" aria-live="polite"></div>
    </main>
  </div>

  <dialog class="modal glass" id="modal" aria-labelledby="modalTitle"></dialog>
  <dialog class="modal modal--sm glass" id="modal2" aria-labelledby="modal2Title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/js/shared.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
